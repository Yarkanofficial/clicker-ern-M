<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ClickArena M - Home</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

<h1>🎮 ClickArena M</h1>

<h2>Welcome Back 👋</h2>

<p>Your personal dashboard</p>

<hr>

<div class="card">
<h3>👤 Player</h3>
<p id="playerName">Guest</p>
</div>

<br>

<div class="card">
<h3>📈 Your Clicks</h3>
<p id="clickCount">0</p>
</div>

<br>

<div class="card">
<h3>💰 Wallet</h3>
<p>$0.00</p>
</div>

<br>

<div class="card">
<h3>🏆 Rank</h3>
<p>#--</p>
</div>

<br>

<div class="card">
<h3>👥 Players Online</h3>
<p>0</p>
</div>

<br>

<div class="card">
<h3>🎁 Daily Prize</h3>
<p>$0</p>
</div>

<br>

<div class="card">
<h3>⏰ Daily Timer</h3>
<p id="dailyTimer">24:00:00</p>
</div>

<br>

<button onclick="location.href='index.html'">
🎮 Play Game
</button>

<br><br>

<button onclick="location.href='leaderboard.html'">
🏆 Leaderboard
</button>

<br><br>

<button onclick="location.href='login.html'">
🚪 Logout
</button>

</div>

<script>
const clicks = localStorage.getItem("clicks") || 0;
document.getElementById("clickCount").innerText = clicks;
</script>

<script src="script.js"></script>

</body>
</html>
