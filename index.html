<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ClickArena M</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

<h1>🎮 ClickArena M</h1>

<p id="message"></p>

<h2>Welcome</h2>

<input
type="email"
id="email"
placeholder="Enter Email">

<br><br>

<input
type="password"
id="password"
placeholder="Enter Password">

<br><br>

<button id="registerBtn">
Register
</button>

<button id="loginBtn">
Login
</button>

<button id="logoutBtn">
Logout
</button>

<hr>

<h2 id="clicks">
Clicks: 0
</h2>

<h2 id="coins">
Coins: 0
</h2>

<h2 id="timer">
⏰ 24:00:00
</h2>

<button onclick="clickGame()">
🔥 CLICK 🔥
</button>

<br><br>
<button onclick="claimDailyPrize()">
🎁 Daily Prize
</button>

<br><br>

<button onclick="location.href='leaderboard.html'">
🏆 Leaderboard
</button>

<br><br>

</div>

<script type="module" src="script.js"></script>

</body>
</html>
