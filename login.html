<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ClickArena M - Login</title>

<link rel="stylesheet" href="style.css">

<style>
body{
background:#0f172a;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
font-family:Arial;
}

.login-box{
background:#1e293b;
padding:30px;
border-radius:15px;
width:320px;
text-align:center;
color:white;
}

input{
width:100%;
padding:12px;
margin:10px 0;
border:none;
border-radius:8px;
}

button{
width:100%;
padding:12px;
background:#22c55e;
border:none;
color:white;
font-size:18px;
border-radius:8px;
cursor:pointer;
}
</style>

</head>

<body>

<div class="login-box">

<h1>🎮 ClickArena M</h1>

<input type="email" placeholder="Email">

<input type="password" placeholder="Password">

<button>Login</button>

</div>

</body>
</html>
